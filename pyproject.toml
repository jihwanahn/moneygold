[project]
name = "moneygold"
version = "0.2.0.dev0"
description = "KOSPI/KOSDAQ swing-trading watchlist (Weinstein + Minervini + Darvas + 펀더멘털 + 컨센서스)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "pykrx>=1.0.45",   # 종목 마스터 전용 (KIS 미제공). ARCHITECTURE §2 참조.
    "yfinance>=0.2.40",  # 컨센서스(애널리스트 목표가/추정 EPS·매출) 전용. 대형주 위주 커버.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "vcrpy>=6.0",
]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneygold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
